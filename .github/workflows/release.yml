name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Require the tagged commit to be on master
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Build the release jar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew build -PappVersion="$VERSION" --console=plain
          unzip -p build/libs/modpack-updater.jar META-INF/MANIFEST.MF | grep -F "Implementation-Version: $VERSION"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes "${ARGS[@]}" build/libs/modpack-updater.jar
