# tinylog is configured from this file rather than from code: tinylog applies (and freezes) its
# configuration when the first logger is created, which can happen before any class of ours runs.
writer1 = io.github.deshark42.modpackupdater.log.ConsoleWriter
writer1.level = trace
writer2 = io.github.deshark42.modpackupdater.log.TranscriptWriter
writer2.level = trace
